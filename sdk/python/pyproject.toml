[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-sdk"
version = "0.1.0"
description = "Minimal Python client for the Nebula chain RPC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
signing = ["PyNaCl>=1.5"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nebula*"]
