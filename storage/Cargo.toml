[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[features]
default = ["rocksdb"]
rocksdb = ["dep:rocksdb"]
sled-legacy = ["dep:sled"]

[dependencies]
common = { path = "../common" }
rocksdb = { version = "0.21", optional = true }
sled = { version = "0.34", optional = true }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
tempfile = "3"
bincode = "1.3"
anyhow = "1.0"
tracing = "0.1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
