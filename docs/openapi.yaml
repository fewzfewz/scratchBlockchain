openapi: "3.0.3"
info:
  title: Nebula RPC API
  description: |
    HTTP JSON-RPC API for the Nebula blockchain node.
    Default endpoint: http://localhost:8545
  version: "0.1.0"
  contact:
    name: Nebula Team

servers:
  - url: http://localhost:8545
    description: Local node

paths:
  # ─── Status & Health ──────────────────────────────────────────────────────
  /status:
    get:
      summary: Node status
      description: Returns node health and height information.
      operationId: getStatus
      responses:
        "200":
          description: Node status
          content:
            application/json:
              schema:
                type: object
                properties:
                  height:
                    type: integer
                    description: Current chain height
                    example: 42
                  finalized_height:
                    type: integer
                    description: Latest finalized block height
                    example: 41
                  mempool_size:
                    type: integer
                    description: Number of pending transactions
                    example: 0
                  peer_count:
                    type: integer
                    description: Number of connected peers
                    example: 3

  /health:
    get:
      summary: Health check
      description: Returns 200 OK when the node is operational.
      operationId: getHealth
      responses:
        "200":
          description: Node is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                    example: "0.1.0"

  # ─── Blocks ───────────────────────────────────────────────────────────────
  /block/latest:
    get:
      summary: Get latest block
      description: Returns the most recent block.
      operationId: getBlockLatest
      responses:
        "200":
          description: Latest block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "404":
          description: No blocks produced yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"

  /block/{height}:
    get:
      summary: Get block by height
      description: Returns the block at the specified height.
      operationId: getBlockByHeight
      parameters:
        - name: height
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Block height
      responses:
        "200":
          description: Block data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"

  /block/hash/{hash}:
    get:
      summary: Get block by hash
      description: Returns the block with the specified 32-byte hex hash.
      operationId: getBlockByHash
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{64}$'
          description: 32-byte block hash (hex with 0x prefix)
      responses:
        "200":
          description: Block data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"

  # ─── Accounts ─────────────────────────────────────────────────────────────
  /balance/{address}:
    get:
      summary: Get account balance
      description: Returns the balance and nonce for the specified address.
      operationId: getBalance
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: 20-byte address (hex with 0x prefix)
      responses:
        "200":
          description: Account balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    example: "0x742d35Cc6634C0532925a3b844Bc9e7595f2bD18"
                  balance:
                    type: string
                    description: Balance in wei (as decimal string)
                    example: "1000000000000000000"
                  nonce:
                    type: integer
                    description: Transaction count
                    example: 0

  # ─── Transactions ─────────────────────────────────────────────────────────
  /mempool:
    get:
      summary: View mempool
      description: Returns pending transactions in the mempool.
      operationId: getMempool
      responses:
        "200":
          description: Mempool contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: integer
                    description: Number of pending transactions
                    example: 0
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"

  /submit_tx:
    post:
      summary: Submit transaction
      description: Submits a signed transaction to the mempool and broadcasts it to peers.
      operationId: submitTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Transaction"
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  hash:
                    type: string
                    description: Transaction hash (hex)
                    example: "abc123..."

  /tx/{hash}:
    get:
      summary: Get transaction receipt
      description: Returns the receipt for a transaction by hash.
      operationId: getTransactionReceipt
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{64}$'
      responses:
        "200":
          description: Transaction receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt:
                    type: object
                    nullable: true
                  error:
                    type: string
                    nullable: true

  # ─── Gas & Fees (EIP-1559) ───────────────────────────────────────────────
  /gas_price:
    get:
      summary: Get gas price
      description: Returns current EIP-1559 gas price suggestions.
      operationId: getGasPrice
      responses:
        "200":
          description: Gas price data
          content:
            application/json:
              schema:
                type: object
                properties:
                  base_fee:
                    type: string
                    example: "1000000000"
                  suggested_priority_fee_low:
                    type: string
                    example: "1000000000"
                  suggested_priority_fee_medium:
                    type: string
                    example: "2000000000"
                  suggested_priority_fee_high:
                    type: string
                    example: "5000000000"
                  block_height:
                    type: integer
                    example: 0

  /estimate_gas:
    post:
      summary: Estimate gas
      description: Estimates gas cost for a transaction.
      operationId: estimateGas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                data:
                  type: string
                value:
                  type: string
                max_fee_per_gas:
                  type: string
      responses:
        "200":
          description: Gas estimation
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimated_gas:
                    type: integer
                  base_fee:
                    type: string
                  total_cost_estimate:
                    type: string
                  estimated_priority_fee:
                    type: string

  /fee_history/{count}:
    get:
      summary: Fee history
      description: Returns historical gas fee data for the last N blocks.
      operationId: getFeeHistory
      parameters:
        - name: count
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Fee history
          content:
            application/json:
              schema:
                type: object
                properties:
                  base_fee_per_gas:
                    type: array
                    items:
                      type: string
                  gas_used_ratio:
                    type: array
                    items:
                      type: number
                      format: float
                  oldest_block:
                    type: integer

  # ─── Validators & Staking ─────────────────────────────────────────────────
  /validators:
    get:
      summary: List validators
      description: Returns the active validator set.
      operationId: getValidators
      responses:
        "200":
          description: Validator list
          content:
            application/json:
              schema:
                type: object
                properties:
                  validators:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidatorInfo"
                  count:
                    type: integer

  /delegations/{address}:
    get:
      summary: Get delegations
      description: Returns delegations for the specified address.
      operationId: getDelegations
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
      responses:
        "200":
          description: Delegation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegations:
                    type: array
                    items:
                      type: object
                      properties:
                        validator_address:
                          type: string
                        amount:
                          type: string
                  address:
                    type: string

  # ─── Governance ───────────────────────────────────────────────────────────
  /governance:
    get:
      summary: Governance state
      description: Returns on-chain governance state (proposals, treasury, parameters) read directly from the state trie.
      operationId: getGovernance
      responses:
        "200":
          description: Governance overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  params:
                    type: object
                    properties:
                      proposal_deposit:
                        type: string
                      voting_period_blocks:
                        type: integer
                      quorum_threshold_bps:
                        type: integer
                      pass_threshold_bps:
                        type: integer
                  treasury:
                    type: object
                    properties:
                      balance:
                        type: string
                      total_collected:
                        type: string
                      total_spent:
                        type: string
                  total_stake:
                    type: string
                  next_proposal_id:
                    type: integer
                  height:
                    type: integer
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"

  /proposal/{id}:
    get:
      summary: Get proposal
      description: Returns a single proposal with its live status resolved against the current block height.
      operationId: getProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    allOf:
                      - $ref: "#/components/schemas/Proposal"
                      - type: object
                        properties:
                          status:
                            type: string
                            enum: [active, passed, rejected, executed]
                          quorum:
                            type: string
                  error:
                    type: [string, "null"]

  # ─── Network ──────────────────────────────────────────────────────────────
  /peers:
    get:
      summary: List peers
      description: Returns connected peer information.
      operationId: getPeers
      responses:
        "200":
          description: Peer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                    example: 0

  /connect_peer:
    post:
      summary: Connect to peer
      description: Connects to a peer by multiaddress.
      operationId: connectPeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                multiaddr:
                  type: string
                  description: libp2p multiaddress
                  example: /ip4/192.168.1.2/tcp/30333
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # ─── Metrics ──────────────────────────────────────────────────────────────
  /metrics:
    get:
      summary: Prometheus metrics
      description: Exposes Prometheus-format metrics.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Transaction:
      type: object
      properties:
        sender:
          type: array
          items:
            type: integer
          description: Sender address bytes
        to:
          type: array
          items:
            type: integer
          description: Recipient address bytes
        nonce:
          type: integer
        value:
          type: integer
          description: Amount in wei
        gas_limit:
          type: integer
        max_fee_per_gas:
          type: integer
        max_priority_fee_per_gas:
          type: integer
        payload:
          type: array
          items:
            type: integer
          description: Calldata or contract bytecode
        chain_id:
          type: integer
        signature:
          type: array
          items:
            type: integer
          description: Ed25519 signature (64 bytes)

    BlockResponse:
      type: object
      properties:
        block:
          type: object
          nullable: true
          description: Block data (null if not found)
        error:
          type: string
          nullable: true
          description: Error message if block not found

    ValidatorInfo:
      type: object
      properties:
        address:
          type: string
        public_key:
          type: string
        stake:
          type: string
        commission_rate:
          type: integer
        is_active:
          type: boolean
        blocks_produced:
          type: integer
        blocks_missed:
          type: integer
        delegator_count:
          type: integer
        total_delegated:
          type: string

    Proposal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        proposer:
          type: string
        status:
          type: string
          enum: [active, passed, rejected, executed]
        start_block:
          type: integer
        end_block:
          type: integer
        voting_period_blocks:
          type: integer
        yes_votes:
          type: string
        no_votes:
          type: string
        abstain_votes:
          type: string
        total_votes:
          type: string
        quorum:
          type: string
        voters:
          type: object
          additionalProperties:
            type: string
