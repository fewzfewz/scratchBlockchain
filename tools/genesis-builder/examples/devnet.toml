# ============================================================================
# DEVNET GENESIS CONFIGURATION
# ============================================================================
# Network: Modular Blockchain Devnet
# Chain ID: modular-devnet-1
# Purpose: Development and testing environment
# Validators: 3 (simple for testing)
# Block Time: 3 seconds (3000ms) for faster testing
# ============================================================================

[chain]
chain_id = "modular-devnet-1"
timestamp = 1700000000  # Use current UNIX timestamp
initial_height = 0
network_id = 12345
name = "Modular Blockchain Devnet"

# ============================================================================
# CONSENSUS PARAMETERS (Optimized for Development)
# ============================================================================
[consensus]
# Fast block production for development (3 seconds)
block_time_ms = 3000

# Validator limits (small for devnet)
max_validators = 100
min_stake = "1000000000000000000"  # Minimum 1 token
unbonding_period = 100             # Fast unbonding for testing (100 blocks)
max_validators_per_epoch = 50

# ============================================================================
# GOVERNANCE PARAMETERS (Simplified for Testing)
# ============================================================================
[governance]
proposal_deposit = "1000000000000000000"  # 1 token deposit
voting_period_blocks = 1000              # ~50 minutes for testing
quorum_threshold = "0.334"               # 33.4% quorum
approval_threshold = "0.5"               # 50% approval
max_proposals = 50

# ============================================================================
# ECONOMIC PARAMETERS (Test-friendly)
# ============================================================================
[economic]
# Higher initial reward for testing (10 tokens)
initial_block_reward = "10000000000000000000"  # 10 tokens
halving_interval = 2100000                    # ~4 years (unchanged)
fee_burn_percentage = 50                       # Burn 50% of fees
treasury_address = "0x0000000000000000000000000000000000000000"

# ============================================================================
# DEVNET VALIDATORS (3 validators for local testing)
