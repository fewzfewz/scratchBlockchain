# ============================================================================
# MAINNET GENESIS CONFIGURATION
# ============================================================================
# Network: Modular Blockchain Mainnet
# Chain ID: modular-mainnet-1
# Launch Date: TBD (set timestamp before launch)
# Validators: Minimum 100, Maximum 300
# Block Time: 6 seconds (6000ms) for mainnet stability
# ============================================================================

[chain]
chain_id = "modular-mainnet-1"
timestamp = 1700000000  # UPDATE BEFORE LAUNCH: Use current UNIX timestamp
initial_height = 0
network_id = 1
name = "Modular Blockchain Mainnet"

# ============================================================================
# CONSENSUS PARAMETERS
# ============================================================================
[consensus]
# Block production: 6 seconds for mainnet (slower but more stable)
block_time_ms = 6000

# Validator limits
max_validators = 300              # Maximum validators in active set
min_stake = "1000000000000000000000"  # Minimum 1000 tokens to become validator
unbonding_period = 1814400        # 21 days (6s blocks: 21d = 1814400 blocks)
max_validators_per_epoch = 300    # All active validators per epoch

# ============================================================================
# GOVERNANCE PARAMETERS
# ============================================================================
[governance]
proposal_deposit = "10000000000000000000000"  # 10,000 tokens deposit
voting_period_blocks = 302400                # 21 days (6s blocks)
quorum_threshold = "0.40"                     # 40% quorum required
approval_threshold = "0.6667"                 # 66.67% approval required
max_proposals = 200                           # Max active proposals

# ============================================================================
# ECONOMIC PARAMETERS
# ============================================================================
[economic]
# Initial block reward: 2 tokens per block
initial_block_reward = "2000000000000000000"  # 2 tokens
halving_interval = 3153600                    # 2 years (6s blocks: 2y ≈ 31.5M blocks)
fee_burn_percentage = 50                      # Burn 50% of transaction fees
treasury_address = "0x0000000000000000000000000000000000000000"  # Set treasury address

# ============================================================================
# GENESIS VALIDATORS
# ============================================================================
# NOTE: Add mainnet validators here before launch
# Each validator must stake minimum 1000 tokens

[[validators]]
address = "0x1111111111111111111111111111111111111111"
stake = "10000000000000000000000"   # 10,000 tokens
commission_rate = "0.05"             # 5% commission
public_key = "0x1111111111111111111111111111111111111111111111111111111111111111"
description = "Mainnet Validator 1"
website = "https://validator1.example.com"

[[validators]]
address = "0x2222222222222222222222222222222222222222"
stake = "10000000000000000000000"   # 10,000 tokens
commission_rate = "0.05"             # 5% commission
public_key = "0x2222222222222222222222222222222222222222222222222222222222222222"
description = "Mainnet Validator 2"
website = "https://validator2.example.com"

[[validators]]
address = "0x3333333333333333333333333333333333333333"
stake = "10000000000000000000000"   # 10,000 tokens
commission_rate = "0.05"             # 5% commission
public_key = "0x3333333333333333333333333333333333333333333333333333333333333333"
