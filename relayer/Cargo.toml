[package]
name = "nebula-relayer"
version = "0.1.0"
edition = "2021"
description = "Standalone Ethereum → Nebula bridge relayer"

[[bin]]
name = "nebula-relayer"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = "2"
hex = "0.4"
anyhow = "1.0"

[lints]
workspace = true
