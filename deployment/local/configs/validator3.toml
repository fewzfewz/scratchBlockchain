[network]
chain_id = "modular-testnet-1"
p2p_port = 26656
rpc_port = 26657
bootstrap_nodes = ["/dns4/validator1/tcp/26656", "/dns4/validator2/tcp/26656"]

[consensus]
block_time_ms = 3000
max_validators = 100

[validator]
enabled = true
commission_rate = "0.10"

[storage]
data_dir = "/data"

[api]
enabled = true
address = "0.0.0.0:8545"
cors_origins = ["*"]
# Local devnet only: exposes faucet / validator-register / bridge-relayer routes.
# Set NODE_API_ADMIN_TOKEN to require a bearer token on admin routes.
dev_mode = true

[metrics]
enabled = true
address = "0.0.0.0:9090"
