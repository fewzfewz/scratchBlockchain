version: '3.8'

services:
  # Ethereum Hardhat node (Bridge.sol target chain — port 9545 avoids Nebula 8545)
  hardhat:
    image: node:20-bookworm-slim
    container_name: hardhat
    working_dir: /interop
    volumes:
      - ../../interop:/interop
      - ../../frontend/public:/frontend-public
      - ./configs:/configs-out
    ports:
      - "9545:9545"
    environment:
      - ETH_RPC_URL=http://127.0.0.1:9545
      - BRIDGE_DEPLOY_OUT=/configs-out/bridge-deployment.json
      - FRONTEND_BRIDGE_CONFIG=/frontend-public/bridge-config.json
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq curl >/dev/null &&
               npm install &&
               npx hardhat compile &&
               chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /interop/artifacts /interop/cache /interop/node_modules || true &&
               npx hardhat node --hostname 0.0.0.0 --port 9545"
    networks:
      testnet:
        aliases:
          - hardhat
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://127.0.0.1:9545 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s
    restart: unless-stopped

  # Nebula React frontend (Vite dev server)
  frontend:
    image: node:20-bookworm-slim
    container_name: nebula-frontend
    working_dir: /frontend
    # Run as the host user so host-mounted files (node_modules, .vite cache)
    # stay writable by the host when running `npm run dev` locally.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../../frontend:/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_NEBULA_RPC=http://localhost:8545
      - VITE_ETH_RPC_URL=http://localhost:9545
      - HOME=/tmp
    command: >
      bash -c "npm install --legacy-peer-deps &&
               npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      testnet:
        aliases:
          - frontend
    depends_on:
      validator1:
        condition: service_healthy
    restart: unless-stopped

  # Validator 1 (Bootstrap node)
  validator1:
    build:
      context: ../..
      dockerfile: Dockerfile
    # optional explicit container name (leave if you need it)
    container_name: validator1
    ports:
      - "26656:26656"  # P2P
      - "26657:26657"  # RPC
      - "8545:8545"    # API
      - "9090:9090"    # Metrics
    volumes:
      - validator1_data:/data
      - ./configs/validator1.toml:/config.toml:ro
      - ./configs/validator1_key.json:/data/validator_key.json:ro
      - ./configs/genesis.json:/genesis.json:ro
      - ../../target/release/node:/usr/local/bin/modular-node:ro
    environment:
      - VALIDATOR_NAME=validator1
      - RUST_LOG=info
      - ETH_RPC_URL=http://hardhat:9545
    command: ["start", "--config", "/config.toml", "--genesis", "/genesis.json"]
    networks:
      testnet:
        aliases:
          - validator1
    depends_on:
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:26657/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  # Validator 2
  validator2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: validator2
    ports:
      - "26658:26656"  # host->container P2P (keeps host unique)
      - "26659:26657"  # RPC
      - "8546:8545"    # API
      - "9091:9090"    # Metrics
    volumes:
      - validator2_data:/data
      - ./configs/validator2.toml:/config.toml:ro
      - ./configs/validator2_key.json:/data/validator_key.json:ro
      - ./configs/genesis.json:/genesis.json:ro
      - ../../target/release/node:/usr/local/bin/modular-node:ro
    environment:
      - VALIDATOR_NAME=validator2
      - RUST_LOG=info
    command: ["start", "--config", "/config.toml", "--genesis", "/genesis.json"]
    networks:
      testnet:
        aliases:
          - validator2
    depends_on:
      - validator1
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:26657/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  # Validator 3
  validator3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: validator3
    ports:
      - "26660:26656"
      - "26661:26657"
      - "8547:8545"
      - "9096:9090"
    volumes:
      - validator3_data:/data
      - ./configs/validator3.toml:/config.toml:ro
      - ./configs/validator3_key.json:/data/validator_key.json:ro
      - ./configs/genesis.json:/genesis.json:ro
      - ../../target/release/node:/usr/local/bin/modular-node:ro
    environment:
      - VALIDATOR_NAME=validator3
      - RUST_LOG=info
    command: ["start", "--config", "/config.toml", "--genesis", "/genesis.json"]
    networks:
      testnet:
        aliases:
          - validator3
    depends_on:
      - validator1
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:26657/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  # RPC Node 1 (Public)
  rpc1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: rpc1
    ports:
      - "8548:8545"
      - "26662:26657"
      - "9092:9090"
    volumes:
      - rpc1_data:/data
      - ./configs/rpc1.toml:/config.toml:ro
      - ./configs/genesis.json:/genesis.json:ro
      - ../../target/release/node:/usr/local/bin/modular-node:ro
    environment:
      - NODE_NAME=rpc1
      - RUST_LOG=info
      - ETH_RPC_URL=http://hardhat:9545
    command: ["start", "--config", "/config.toml", "--genesis", "/genesis.json"]
    networks:
      testnet:
        aliases:
          - rpc1
    depends_on:
      validator1:
        condition: service_healthy
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:26657/health || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # RPC Node 2 (Backup)
  rpc2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: rpc2
    ports:
      - "8549:8545"
      - "26663:26657"
      - "9094:9090"
    volumes:
      - rpc2_data:/data
      - ./configs/rpc2.toml:/config.toml:ro
      - ./configs/genesis.json:/genesis.json:ro
      - ../../target/release/node:/usr/local/bin/modular-node:ro
    environment:
      - NODE_NAME=rpc2
      - RUST_LOG=info
    command: ["start", "--config", "/config.toml", "--genesis", "/genesis.json"]
    networks:
      testnet:
        aliases:
          - rpc2
    depends_on:
      - validator1
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:26657/health || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      testnet:
        aliases:
          - prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      testnet:
        aliases:
          - alertmanager
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      testnet:
        aliases:
          - grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Faucet Service
  faucet:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: faucet
    ports:
      - "3001:3006"
    environment:
      - FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY}
      - FAUCET_PORT=3006
      - RPC_URL=http://rpc1:8545
      - DRIP_AMOUNT=1000000000000000000000
      - COOLDOWN_SECONDS=86400
    volumes:
      - ../../target/release/node:/usr/local/bin/modular-node:ro
    command: ["faucet"]
    networks:
      testnet:
        aliases:
          - faucet
    depends_on:
      - rpc1
    restart: unless-stopped

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./faucet.html:/usr/share/nginx/html/faucet.html:ro
    networks:
      testnet:
        aliases:
          - nginx
    depends_on:
      - rpc1
      - rpc2
      - faucet
      - grafana
    restart: unless-stopped

networks:
  testnet:
    driver: bridge

volumes:
  validator1_data:
  validator2_data:
  validator3_data:
  rpc1_data:
  rpc2_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
