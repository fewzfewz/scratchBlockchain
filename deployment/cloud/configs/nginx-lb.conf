events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    upstream rpc_backend {
        least_conn;
        server rpc1:8545 max_fails=3 fail_timeout=30s;
        server rpc2:8545 max_fails=3 fail_timeout=30s;
    }

    upstream faucet_backend {
        server faucet:3000;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    server {
        listen 80;
        server_name rpc.testnet.modular-blockchain.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name rpc.testnet.modular-blockchain.io;

        ssl_certificate     /etc/letsencrypt/live/testnet.modular-blockchain.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/testnet.modular-blockchain.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=rpc:10m rate=100r/s;

        location / {
            limit_req zone=rpc burst=200 nodelay;
            proxy_pass http://rpc_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location /health {
            proxy_pass http://rpc_backend;
            proxy_http_version 1.1;
        }

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    server {
        listen 443 ssl http2;
        server_name faucet.testnet.modular-blockchain.io;

        ssl_certificate     /etc/letsencrypt/live/testnet.modular-blockchain.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/testnet.modular-blockchain.io/privkey.pem;

        location / {
            proxy_pass http://faucet_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
