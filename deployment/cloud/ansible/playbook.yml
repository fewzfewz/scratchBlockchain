---
- name: Deploy Modular Blockchain testnet
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    chain_id: "{{ lookup('env', 'CHAIN_ID') | default('modular-testnet-1', true) }}"
    node_version: "{{ lookup('env', 'NODE_VERSION') | default('latest', true) }}"
    data_dir: "/data/blockchain"
    genesis_path: "{{ playbook_dir }}/../configs/genesis.json"
    node_binary_path: "{{ lookup('env', 'NODE_BINARY_PATH') | default('', true) }}"

  tasks:
    - name: Install system dependencies
      apt:
        name:
          - curl
          - wget
          - unzip
          - git
          - build-essential
          - pkg-config
          - libssl-dev
          - ufw
        state: present
        update_cache: yes

    - name: Configure firewall
      ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: tcp
      loop:
        - { rule: allow, port: 26656 }
        - { rule: allow, port: 26657 }
        - { rule: allow, port: 8545 }
        - { rule: allow, port: 9090 }
        - { rule: allow, port: 22 }

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Create data directory
      file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: Copy locally built node binary
      copy:
        src: "{{ node_binary_path }}"
        dest: "/usr/local/bin/modular-node"
        mode: "0755"
      when: node_binary_path | length > 0

    - name: Download node binary from release
      get_url:
        url: "https://github.com/fewzfewz/scratchBlockchain/releases/download/{{ node_version }}/modular-node-linux-amd64"
        dest: "/usr/local/bin/modular-node"
        mode: "0755"
      when: node_binary_path | length == 0 and node_version != "source"

    - name: Deploy node via role
      include_role:
        name: node
      vars:
        genesis_src: "{{ genesis_path }}"

  handlers:
    - name: restart modular-node
      systemd:
        name: modular-node
        state: restarted
