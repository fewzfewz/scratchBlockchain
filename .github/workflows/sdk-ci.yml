name: SDK CI

on:
  push:
    paths:
      - "sdk/javascript/**"
      - ".github/workflows/sdk-ci.yml"
    branches: [main]
  pull_request:
    paths:
      - "sdk/javascript/**"
      - ".github/workflows/sdk-ci.yml"
    branches: [main]

defaults:
  run:
    working-directory: sdk/javascript

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdk/javascript/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --workspaces=false
        working-directory: sdk/javascript

      - name: Build
        run: npm run build
        working-directory: sdk/javascript

      - name: Publish SDK to npm (if version not yet published)
        working-directory: sdk/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "nebula-chain-sdk@${VER}" version >/dev/null 2>&1; then
            echo "nebula-chain-sdk@${VER} already published, skipping"
          else
            npm publish --access public --workspaces=false
          fi

      - name: Publish CLI to npm (if version not yet published)
        working-directory: sdk/javascript/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "nebula-chain-cli@${VER}" version >/dev/null 2>&1; then
            echo "nebula-chain-cli@${VER} already published, skipping"
          else
            npm publish --access public --workspaces=false
          fi
