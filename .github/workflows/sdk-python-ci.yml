name: Python SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/sdk-python-ci.yml"
  workflow_dispatch:

concurrency:
  group: sdk-python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev & signing extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[signing,dev]" build

      - name: Run pytest
        run: pytest

      - name: Build distribution
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist-${{ matrix.python-version }}
          path: sdk/python/dist/

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-py-v')
    needs: test-and-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: sdk/python/dist
