name: Rust CI

on:
  push:
    branches: [ main, feat/production-readiness ]
  pull_request:
    branches: [ main, feat/production-readiness ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        components: rustfmt, clippy
        override: true
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Build
      run: cargo build --workspace --verbose
    
    - name: Run tests
      run: cargo test --workspace --verbose

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Build node
        run: cargo build -p node --release

      - name: Start local testnet
        run: |
          cd deployment/local
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8545/health && break
            sleep 5
          done
          curl -sf http://localhost:8545/status

      - name: Install integration test deps
        run: |
          cd tests/localhost
          npm install --ignore-scripts 2>/dev/null || true

      - name: Run integration tests
        run: |
          cd tests/localhost/scripts
          node 01-send-transaction.js
          node 02-state-queries.js
          node 11-create-proposal.js
          node 12-vote-proposal.js
          node 16-stake-tokens.js
          node 21-bridge-lock.js
          node 22-bridge-unlock.js
          node 25-propose-upgrade.js
          node 40-load-test.js

      - name: Stop testnet
        if: always()
        run: cd deployment/local && docker compose down -v
