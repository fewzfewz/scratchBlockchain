name: Node CI/CD (Rust + Docker)

on:
  push:
    branches: [main]
    tags: ["node-v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "common/**"
      - "consensus/**"
      - "storage/**"
      - "network/**"
      - "execution/**"
      - "mempool/**"
      - "mev/**"
      - "governance/**"
      - "da/**"
      - "zk/**"
      - "runtime/**"
      - "monitoring/**"
      - "node/**"
      - ".github/workflows/node-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "common/**"
      - "consensus/**"
      - "storage/**"
      - "network/**"
      - "execution/**"
      - "mempool/**"
      - "mev/**"
      - "governance/**"
      - "da/**"
      - "zk/**"
      - "runtime/**"
      - "monitoring/**"
      - "node/**"
      - ".github/workflows/node-cd.yml"
  workflow_dispatch:

concurrency:
  group: node-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (node)
        run: cargo clippy -p node --all-targets -- -D warnings

      - name: Test (node)
        run: cargo test -p node

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nebula-node
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},prefix=node-v
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
