[package]
name = "zk"
version = "0.1.0"
edition = "2021"

[features]
default = []
halo2 = ["halo2_proofs", "halo2curves"]

[dependencies]
rand = "0.8"
anyhow = "1.0"
sha2 = "0.10"
tracing = "0.1"
rayon = "1"
halo2_proofs = { version = "0.3", optional = true }
halo2curves = { version = "0.1", optional = true }
