# Render Blueprint for a 4-validator Nebula BFT network + public RPC node.
# Note: Private Services (pserv) and Persistent Disks require a paid Render plan (Starter+).
# After deploying the Blueprint:
#   1. Upload each validator's unique key as a Render Secret File at /data/validator_key.json
#      matching the 4 public_keys in deployment/local/configs/genesis.json.
#   2. Set NODE_API_ADMIN_TOKEN and (optionally) NODE_API_DEV_FUNDING_KEY on nebula-rpc.

services:
  - type: pserv
    name: nebula-validator-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: start --config /etc/nebula/render/validator.toml --genesis /etc/nebula/multi-genesis.json
    plan: starter
    region: oregon
    disk:
      name: validator1-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: RUST_LOG
        value: info
      - key: NODE_VALIDATOR_ENABLED
        value: "true"

  - type: pserv
    name: nebula-validator-2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: start --config /etc/nebula/render/validator.toml --genesis /etc/nebula/multi-genesis.json
    plan: starter
    region: oregon
    disk:
      name: validator2-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: RUST_LOG
        value: info
      - key: NODE_VALIDATOR_ENABLED
        value: "true"

  - type: pserv
    name: nebula-validator-3
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: start --config /etc/nebula/render/validator.toml --genesis /etc/nebula/multi-genesis.json
    plan: starter
    region: oregon
    disk:
      name: validator3-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: RUST_LOG
        value: info
      - key: NODE_VALIDATOR_ENABLED
        value: "true"

  - type: pserv
    name: nebula-validator-4
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: start --config /etc/nebula/render/validator.toml --genesis /etc/nebula/multi-genesis.json
    plan: starter
    region: oregon
    disk:
      name: validator4-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: RUST_LOG
        value: info
      - key: NODE_VALIDATOR_ENABLED
        value: "true"

  - type: web
    name: nebula-rpc
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: start --config /etc/nebula/render/rpc.toml --genesis /etc/nebula/multi-genesis.json
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: rpc-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8545"
      - key: RUST_LOG
        value: info
      - key: NODE_VALIDATOR_ENABLED
        value: "false"
      - key: NODE_API_DEV_MODE
        value: "true"
      - key: NODE_API_ADMIN_TOKEN
        sync: false
      - key: NODE_API_DEV_FUNDING_KEY
        sync: false
      - key: ETH_RPC_URL
        sync: false
      - key: ETH_BRIDGE_ADDRESS
        sync: false

  # ETH -> Nebula relayer #1 (signs TokensLocked attestations and submits bridge_mint)
  - type: worker
    name: nebula-relayer-1
    runtime: docker
    dockerfilePath: ./relayer/Dockerfile
    plan: starter
    region: oregon
    disk:
      name: relayer1-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RUST_LOG
        value: info
      - key: NEBULA_RPC_URLS
        value: http://nebula-rpc:8545
      - key: NEBULA_CHAIN_ID
        value: "1"
      - key: ETH_CONFIRMATIONS
        value: "2"
      - key: RELAYER_STATE_FILE
        value: /data/relayer-state.json
      - key: ETH_RPC_URL
        sync: false
      - key: ETH_BRIDGE_ADDRESS
        sync: false
      - key: RELAYER_KEY
        sync: false

  # ETH -> Nebula relayer #2 (meets 2-of-3 attestation threshold)
  - type: worker
    name: nebula-relayer-2
    runtime: docker
    dockerfilePath: ./relayer/Dockerfile
    plan: starter
    region: oregon
    disk:
      name: relayer2-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RUST_LOG
        value: info
      - key: NEBULA_RPC_URLS
        value: http://nebula-rpc:8545
      - key: NEBULA_CHAIN_ID
        value: "1"
      - key: ETH_CONFIRMATIONS
        value: "2"
      - key: RELAYER_STATE_FILE
        value: /data/relayer-state.json
      - key: ETH_RPC_URL
        sync: false
      - key: ETH_BRIDGE_ADDRESS
        sync: false
      - key: RELAYER_KEY
        sync: false

  # Nebula -> ETH unlock relayer (submits Bridge.unlockTokens on Sepolia/Ethereum)
  - type: worker
    name: nebula-eth-unlock-relayer
    runtime: docker
    dockerfilePath: ./interop/Dockerfile.relayer
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NEBULA_RPC_URL
        value: http://nebula-rpc:8545
      - key: ETH_RPC_URL
        sync: false
      - key: ETH_BRIDGE_ADDRESS
        sync: false
      - key: RELAYER_PRIVATE_KEYS
        sync: false
