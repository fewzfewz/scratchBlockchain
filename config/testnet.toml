[network]
chain_id = "modular-testnet-1"
p2p_port = 30333
rpc_port = 9933
bootstrap_nodes = [
    "/dns4/validator1/tcp/30333/p2p/12D3KooWBootstrap1",
    "/dns4/validator2/tcp/30333/p2p/12D3KooWBootstrap2",
    "/dns4/validator3/tcp/30333/p2p/12D3KooWBootstrap3"
]

[consensus]
block_time_ms = 6000
max_validators = 100
min_validator_stake = 1000
epoch_length = 100
max_rounds_per_height = 1000

[validator]
enabled = true
key_file = "/data/validator_key.json"

[storage]
data_dir = "/data"

[api]
enabled = true
address = "0.0.0.0"
cors_origins = ["*"]
rate_limit = 1000

[metrics]
enabled = true
address = "0.0.0.0:9090"
